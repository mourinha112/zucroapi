# Nginx config para deploy com PM2 (sem Docker)
# Copiar para: /etc/nginx/sites-available/zucropay-api
# Ativar: ln -s /etc/nginx/sites-available/zucropay-api /etc/nginx/sites-enabled/

upstream zucropay_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate Limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.appzucropay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name api.appzucropay.com;

    # SSL (Certbot)
    ssl_certificate /etc/letsencrypt/live/api.appzucropay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.appzucropay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10M;

    # Health
    location /health {
        proxy_pass http://zucropay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Webhooks (sem rate limit rígido)
    location /api/webhooks {
        proxy_pass http://zucropay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API v1 (integradores)
    location /api/v1 {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://zucropay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (dashboard)
    location /api {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://zucropay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404 '{"error": "Not Found"}';
        add_header Content-Type application/json;
    }
}
